{% extends "base.html" %}

{% block content %}
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>✍️ Publier un nouvel article</h3>
        </div>
        <div class="card-body">
            <!-- ✅ IMPORTANT : Ajout de enctype="multipart/form-data" pour l'upload -->
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Titre de l'article</label>
                    <input type="text" name="titre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contenu de l'article</label>
                    <textarea name="contenu" class="form-control" rows="8" required></textarea>
                </div>

                <!-- ✅ NOUVEAU : Champ pour UPLOADER une image depuis l'ordinateur -->
                <div class="mb-3">
                    <label for="image" class="form-label">Choisir une image (depuis votre ordinateur)</label>
                    <input type="file" class="form-control" id="image" name="image" accept="image/*">
                    <small class="text-muted">Sélectionnez un fichier image (.jpg, .png, .gif).</small>
                </div>

                <button type="submit" class="btn btn-success">Publier l'article</button>
                <a href="/admin" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
{% endblock %}
