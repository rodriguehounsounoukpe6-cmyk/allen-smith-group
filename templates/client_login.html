{% extends "base.html" %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h3 class="text-center mb-4">🔐 Espace Client</h3>
                <p class="text-center text-muted">Entrez le mot de passe pour accéder à votre espace privé.</p>
                
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Mot de passe Client</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="/">Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
