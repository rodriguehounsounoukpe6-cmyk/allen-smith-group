{% extends "base.html" %}

{% block content %}
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>📤 Publier un nouveau média</h3>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Titre du fichier</label>
                    <input type="text" name="titre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Type de fichier</label>
                    <select name="type_fichier" class="form-control" required>
                        <option value="image">Image</option>
                        <option value="pdf">PDF</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="fichier" class="form-label">Choisir le fichier</label>
                    <input type="file" class="form-control" id="fichier" name="fichier" required>
                </div>
                <button type="submit" class="btn btn-success">Publier le média</button>
                <a href="/admin" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
{% endblock %}
